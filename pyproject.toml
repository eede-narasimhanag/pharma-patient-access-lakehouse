[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma-patient-access-lakehouse"
version = "0.1.0"
description = "Synthetic pharma patient-access analytics lakehouse demo"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["databricks/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I"]
